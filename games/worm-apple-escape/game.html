<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>애벌레 사과 탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/*
VOICE: 귀여운 동화 스티커, 짧고 경쾌한 말투
IDEA: 사과 상자 속 애벌레 스티커판
PICTURE: 게임판 자체가 그림
COLOUR and TYPE: 풀색 바탕, 사과 빨강, 크림, Jua
LAYOUT: 위에 점수와 시간, 가운데 판, 아래 범례
*/
:root{color-scheme:light dark;--bg:light-dark(#fdf3e1,#2a2018);--ink:light-dark(#4a3426,#f6e7d0);--card:light-dark(#fffaf0,#3a2c20);--line:light-dark(#e4cfae,#5a4430)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Jua",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#wrap{max-width:460px;margin:0 auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
#hud{width:100%;display:flex;justify-content:space-between;gap:8px;font-size:18px}
.box{background:var(--card);border-radius:12px;padding:6px 12px;box-shadow:0 2px 0 var(--line);white-space:nowrap}
#timebar{width:100%;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
#timefill{height:100%;background:#7cc36a;width:100%;transition:background .3s}
canvas{touch-action:none;display:block;border-radius:16px}
#msg{height:22px;font-size:16px;color:#e2553f;text-align:center}
#legend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:14px}
#legend span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
#overlay{position:fixed;inset:0;background:rgba(40,28,20,.6);display:flex;align-items:center;justify-content:center;z-index:5}
#overlay.hide{display:none}
#panel{background:var(--card);border-radius:20px;padding:24px 22px;text-align:center;width:min(88vw,340px)}
#panel h1{font-size:28px;line-height:1.1;margin-bottom:10px}
#panel p{font-size:15px;line-height:1.55;margin-bottom:16px;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#panel .big{font-family:"Jua",sans-serif;font-size:40px;margin:6px 0}
button{font:inherit;font-size:19px;background:#e2553f;color:#fff;border:0;border-radius:14px;padding:12px 30px;min-height:44px;box-shadow:0 4px 0 #a83727;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #a83727}
button:focus-visible{outline:3px solid #7cc36a;outline-offset:3px}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="box">점수 <b id="score">0</b></div>
    <div class="box">시간 <b id="time">60</b></div>
    <div class="box">최고 <b id="best">0</b></div>
  </div>
  <div id="timebar"><div id="timefill"></div></div>
  <canvas id="cv"></canvas>
  <div id="msg"></div>
  <div id="legend">
    <span><i class="dot" style="background:#e5483a"></i>빨강: 아무 방향</span>
    <span><i class="dot" style="background:#86c440"></i>초록: 직진만</span>
    <span><i class="dot" style="background:#f3c43a"></i>노랑: 꼭 꺾기</span>
    <span><i class="dot" style="background:#8b6b4a"></i>썩음: 못 지나감</span>
    <span><i class="dot" style="background:#ffd23f;box-shadow:0 0 0 2px #fff7c2"></i>황금: 보너스</span>
  </div>
</div>
<div id="overlay"><div id="panel"></div></div>
<script>
{
const COLS = 6, ROWS = 8, TIME = 60, TIME_BONUS = 2;
const RED = 0, GREEN = 1, YELLOW = 2, ROTTEN = 3, GOLD = 4;
const COLOR = ['#e5483a', '#86c440', '#f3c43a', '#8b6b4a', '#ffd23f'];
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

let cs, pad, W, H;
let grid = [], sr = 0, er = 0, path = [], dragging = false;
let state = 'menu', anim = null, score = 0, timeLeft = TIME, best = 0;
let flash = null, popups = [], msgTimer = 0, lastT = 0;

try { best = +localStorage.getItem('wormAppleBest') || 0; } catch (e) {}
$('best').textContent = best;

function resize() {
  const maxW = Math.min(window.innerWidth - 24, 436);
  const maxH = window.innerHeight - 210;
  cs = Math.max(34, Math.floor(Math.min(maxW / (COLS + 1.4), maxH / ROWS)));
  pad = Math.floor(cs * 0.7);
  W = COLS * cs + pad * 2; H = ROWS * cs;
  const dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

// 판 만들기: 먼저 정답 길을 하나 만들고 나머지는 랜덤
function genBoard() {
  for (let tries = 0; tries < 200; tries++) {
    sr = Math.floor(Math.random() * ROWS);
    er = Math.floor(Math.random() * ROWS);
    const p = carvePath();
    if (!p) continue;
    grid = [];
    for (let y = 0; y < ROWS; y++) {
      grid.push([]);
      for (let x = 0; x < COLS; x++) grid[y].push(randomType());
    }
    p.forEach((c, i) => {
      const inD = inDirOf(p, i);
      const outD = i === p.length - 1 ? [1, 0] : [p[i + 1][0] - c[0], p[i + 1][1] - c[1]];
      const straight = inD[0] === outD[0] && inD[1] === outD[1];
      const r = Math.random();
      grid[c[1]][c[0]] = r < 0.1 ? GOLD : r < 0.45 ? RED : (straight ? GREEN : YELLOW);
    });
    return;
  }
}

function randomType() {
  const r = Math.random() * 100;
  if (r < 35) return RED;
  if (r < 57) return GREEN;
  if (r < 79) return YELLOW;
  if (r < 95) return ROTTEN;
  return GOLD;
}

function carvePath() {
  const vis = new Set(), p = [];
  let steps = 0;
  const minLen = COLS + 2, maxLen = 18;
  function dfs(x, y) {
    if (++steps > 5000) return false;
    vis.add(y * COLS + x); p.push([x, y]);
    if (x === COLS - 1 && y === er) {
      if (p.length >= minLen) return true;
    } else if (p.length < maxLen) {
      const ds = [[1, 0, 3], [0, 1, 2], [0, -1, 2], [-1, 0, 1]]
        .map(d => [d[0], d[1], Math.random() * d[2]])
        .sort((a, b) => b[2] - a[2]);
      for (const d of ds) {
        const nx = x + d[0], ny = y + d[1];
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
        if (vis.has(ny * COLS + nx)) continue;
        if (dfs(nx, ny)) return true;
      }
    }
    vis.delete(y * COLS + x); p.pop();
    return false;
  }
  return dfs(0, sr) ? p : null;
}

function inDirOf(p, i) {
  if (i === 0) return [1, 0];
  return [p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]];
}

function allowed(t, inD, outD) {
  if (t === ROTTEN) return false;
  if (t === GREEN) return inD[0] === outD[0] && inD[1] === outD[1];
  if (t === YELLOW) return inD[0] * outD[0] + inD[1] * outD[1] === 0;
  return true;
}

function ruleMsg(t) {
  return t === GREEN ? '초록 사과는 직진만 돼요' : t === YELLOW ? '노란 사과는 꼭 꺾어야 해요' : '';
}

function setMsg(text) {
  $('msg').textContent = text;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => $('msg').textContent = '', 1400);
}

function fail(x, y, text) {
  if (flash && flash.x === x && flash.y === y && flash.t > 0) return;
  flash = { x, y, t: 0.35 };
  if (text) setMsg(text);
}

function tryStep(nx, ny) {
  const last = path[path.length - 1];
  if (path.length >= 2) {
    const pv = path[path.length - 2];
    if (pv[0] === nx && pv[1] === ny) { path.pop(); return true; }
  }
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return false;
  const dx = nx - last[0], dy = ny - last[1];
  if (Math.abs(dx) + Math.abs(dy) !== 1) return false;
  if (path.some(p => p[0] === nx && p[1] === ny)) { fail(nx, ny, '이미 먹은 사과는 못 지나가요'); return false; }
  if (grid[ny][nx] === ROTTEN) { fail(nx, ny, '썩은 사과는 못 지나가요'); return false; }
  const t = grid[last[1]][last[0]];
  if (!allowed(t, inDirOf(path, path.length - 1), [dx, dy])) { fail(last[0], last[1], ruleMsg(t)); return false; }
  path.push([nx, ny]);
  return true;
}

function pathReachesExit() {
  if (!path.length) return false;
  const i = path.length - 1, last = path[i];
  if (last[0] !== COLS - 1 || last[1] !== er) return false;
  return allowed(grid[last[1]][last[0]], inDirOf(path, i), [1, 0]);
}

function cellAt(e) {
  const r = cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  return { x: Math.floor((px - pad) / cs), y: Math.floor(py / cs), px, py };
}

cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || anim) return;
  dragging = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  path = [];
  handleMove(e);
});

cv.addEventListener('pointermove', e => { if (dragging) handleMove(e); });

function handleMove(e) {
  const c = cellAt(e);
  if (!path.length) {
    const onStart = (c.x === 0 || (c.px < pad && c.px >= 0)) && c.y === sr;
    if (onStart) path.push([0, sr]);
    return;
  }
  if (c.x < 0 || c.y < 0 || c.x >= COLS || c.y >= ROWS) return;
  for (let k = 0; k < 20; k++) {
    const last = path[path.length - 1];
    const dx = c.x - last[0], dy = c.y - last[1];
    if (!dx && !dy) break;
    const step = Math.abs(dx) >= Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
    if (!tryStep(last[0] + step[0], last[1] + step[1])) break;
    if (!path.length) break;
  }
}

function endDrag() {
  if (!dragging) return;
  dragging = false;
  if (state !== 'play') { path = []; return; }
  if (pathReachesExit()) startAnim();
  else if (path.length) { setMsg('나비 출구까지 이어야 해요'); path = []; }
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

function cx(x) { return pad + x * cs + cs / 2; }
function cy(y) { return y * cs + cs / 2; }
function entryPt() { return [pad * 0.45, cy(sr)]; }
function exitPt() { return [W - pad * 0.45, cy(er)]; }

function startAnim() {
  const pts = [entryPt(), ...path.map(p => [cx(p[0]), cy(p[1])]), exitPt()];
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  anim = { pts, cum, d: 0, cells: path.slice() };
  path = [];
}

function pointAt(a, d) {
  if (d <= 0) return [a.pts[0][0] + d, a.pts[0][1]];
  const n = a.pts.length;
  if (d >= a.cum[n - 1]) {
    const p = a.pts[n - 1];
    return [p[0] + (d - a.cum[n - 1]), p[1]];
  }
  let i = 1;
  while (a.cum[i] < d) i++;
  const t = (d - a.cum[i - 1]) / (a.cum[i] - a.cum[i - 1]);
  const p0 = a.pts[i - 1], p1 = a.pts[i];
  return [p0[0] + (p1[0] - p0[0]) * t, p0[1] + (p1[1] - p0[1]) * t];
}

function finishAnim() {
  const cells = anim.cells;
  const golds = cells.filter(c => grid[c[1]][c[0]] === GOLD).length;
  let pts = cells.length * 10 + golds * 40;
  if (cells.length >= 12) pts += 50;
  score += pts;
  timeLeft = Math.min(TIME, timeLeft + TIME_BONUS);
  const ep = exitPt();
  popups.push({ x: ep[0] - cs * 0.6, y: ep[1], text: '+' + pts, t: 1 });
  if (cells.length >= 12) setMsg('긴 길 보너스 +50!');
  anim = null;
  genBoard();
}

function startGame() {
  score = 0; timeLeft = TIME; path = []; anim = null; popups = [];
  genBoard();
  state = 'play';
  $('overlay').classList.add('hide');
}

function gameOver() {
  state = 'over'; dragging = false; path = [];
  if (score > best) { best = score; try { localStorage.setItem('wormAppleBest', best); } catch (e) {} }
  $('best').textContent = best;
  showPanel('<h1>시간 끝!</h1><div class="big">' + score + '점</div><p>최고 점수 ' + best + '점</p><button id="go">다시 하기</button>');
}

function showPanel(html) {
  $('panel').innerHTML = html;
  $('overlay').classList.remove('hide');
  $('go').addEventListener('click', startGame);
  $('go').focus();
}

/* 그리기 */
function ell(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill(); }

function drawApple(x, y, t, eaten) {
  const X = cx(x), Y = cy(y), r = cs * 0.36;
  ctx.fillStyle = 'rgba(60,40,20,.12)'; ell(X, Y + r * 0.85, r * 0.8, r * 0.2);
  ctx.fillStyle = COLOR[t];
  ell(X - r * 0.28, Y + r * 0.05, r * 0.72, r * 0.8);
  ell(X + r * 0.28, Y + r * 0.05, r * 0.72, r * 0.8);
  ctx.fillStyle = 'rgba(0,0,0,.08)'; ell(X + r * 0.25, Y + r * 0.35, r * 0.55, r * 0.4);
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ell(X - r * 0.45, Y - r * 0.25, r * 0.18, r * 0.28, 0.4);
  ctx.strokeStyle = '#6b4a2e'; ctx.lineWidth = r * 0.13; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(X, Y - r * 0.55); ctx.lineTo(X + r * 0.1, Y - r * 0.95); ctx.stroke();
  ctx.fillStyle = t === ROTTEN ? '#6e7a3a' : '#4fa33a';
  ell(X + r * 0.38, Y - r * 0.82, r * 0.3, r * 0.13, -0.5);
  if (t === ROTTEN) {
    ctx.fillStyle = '#5c432c';
    ell(X - r * 0.3, Y, r * 0.16, r * 0.13); ell(X + r * 0.3, Y + r * 0.3, r * 0.12, r * 0.1); ell(X + r * 0.15, Y - r * 0.2, r * 0.08, r * 0.07);
  }
  if (eaten) {
    ctx.fillStyle = '#fff3d6'; ell(X, Y + r * 0.05, r * 0.42, r * 0.42);
    ctx.fillStyle = '#e8c98e'; ell(X, Y + r * 0.1, r * 0.25, r * 0.25);
    return;
  }
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = r * 0.17;
  if (t === GREEN) {
    ctx.beginPath(); ctx.moveTo(X, Y - r * 0.28); ctx.lineTo(X, Y + r * 0.45); ctx.stroke();
  } else if (t === YELLOW) {
    ctx.strokeStyle = 'rgba(140,90,10,.75)';
    ctx.beginPath(); ctx.moveTo(X - r * 0.22, Y - r * 0.25); ctx.lineTo(X - r * 0.22, Y + r * 0.3); ctx.lineTo(X + r * 0.33, Y + r * 0.3); ctx.stroke();
  } else if (t === GOLD) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.09;
    const sx = X + r * 0.1, sy = Y + r * 0.1, s = r * 0.3;
    ctx.beginPath(); ctx.moveTo(sx - s, sy); ctx.lineTo(sx + s, sy); ctx.moveTo(sx, sy - s); ctx.lineTo(sx, sy + s); ctx.stroke();
  }
}

function drawWorm(pts) {
  const br = cs * 0.15;
  for (let i = pts.length - 1; i >= 1; i--) {
    ctx.fillStyle = '#5d9a3a'; ell(pts[i][0], pts[i][1], br + 2, br + 2);
    ctx.fillStyle = i % 2 ? '#9bd36a' : '#86c75a'; ell(pts[i][0], pts[i][1], br, br);
  }
  const h = pts[0], hr = cs * 0.19;
  ctx.fillStyle = '#5d9a3a'; ell(h[0], h[1], hr + 2, hr + 2);
  ctx.fillStyle = '#a8de76'; ell(h[0], h[1], hr, hr);
  ctx.fillStyle = '#fff'; ell(h[0] - hr * 0.35, h[1] - hr * 0.2, hr * 0.3, hr * 0.34); ell(h[0] + hr * 0.35, h[1] - hr * 0.2, hr * 0.3, hr * 0.34);
  ctx.fillStyle = '#2b1d12'; ell(h[0] - hr * 0.3, h[1] - hr * 0.15, hr * 0.15, hr * 0.18); ell(h[0] + hr * 0.4, h[1] - hr * 0.15, hr * 0.15, hr * 0.18);
  ctx.fillStyle = 'rgba(240,120,120,.6)'; ell(h[0] - hr * 0.6, h[1] + hr * 0.35, hr * 0.18, hr * 0.12); ell(h[0] + hr * 0.6, h[1] + hr * 0.35, hr * 0.18, hr * 0.12);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#cfe8a8';
  ctx.beginPath(); ctx.roundRect(0, 0, W, H, 16); ctx.fill();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#c3e098' : '#d8edb6';
    ctx.fillRect(pad + x * cs, y * cs, cs, cs);
  }
  if (!grid.length) return;

  const en = entryPt(), ex = exitPt();
  ctx.fillStyle = '#7a5a3a'; ell(en[0], en[1], cs * 0.24, cs * 0.24);
  ctx.fillStyle = '#fff3d6'; ell(ex[0], ex[1], cs * 0.26, cs * 0.26);
  ctx.font = Math.floor(cs * 0.36) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🦋', ex[0], ex[1] + 1);

  const eatenSet = new Set();
  if (anim) anim.cells.forEach((c, i) => { if (anim.d >= anim.cum[i + 1]) eatenSet.add(c[1] * COLS + c[0]); });
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) drawApple(x, y, grid[y][x], eatenSet.has(y * COLS + x));

  if (path.length) {
    const ok = pathReachesExit();
    ctx.strokeStyle = ok ? 'rgba(255,255,255,.85)' : 'rgba(255,255,255,.6)';
    ctx.lineWidth = cs * 0.24; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(en[0], en[1]);
    path.forEach(p => ctx.lineTo(cx(p[0]), cy(p[1])));
    if (ok) ctx.lineTo(ex[0], ex[1]);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.font = Math.floor(cs * 0.3) + 'px Jua, sans-serif';
    const l = path[path.length - 1];
    ctx.fillStyle = '#4a3426';
    ctx.fillText(path.length, cx(l[0]) + cs * 0.32, cy(l[1]) - cs * 0.32);
  }

  if (flash && flash.t > 0) {
    ctx.strokeStyle = 'rgba(226,60,40,' + Math.min(1, flash.t * 3) + ')'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx(flash.x), cy(flash.y), cs * 0.44, 0, Math.PI * 2); ctx.stroke();
  }

  if (anim) {
    const seg = [];
    for (let k = 0; k < 6; k++) seg.push(pointAt(anim, anim.d - k * cs * 0.25));
    drawWorm(seg);
  } else {
    drawWorm([[en[0], en[1]], [en[0] - cs * 0.25, en[1]], [en[0] - cs * 0.5, en[1]]]);
  }

  popups.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.t);
    ctx.fillStyle = '#e2553f'; ctx.font = Math.floor(cs * 0.5) + 'px Jua, sans-serif';
    ctx.fillText(p.text, p.x, p.y - (1 - p.t) * cs);
    ctx.globalAlpha = 1;
  });
}

function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0);
  lastT = now;
  if (state === 'play') {
    if (anim) {
      anim.d += cs * 9 * dt;
      if (anim.d >= anim.cum[anim.cum.length - 1] + cs * 1.5) finishAnim();
    } else {
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; gameOver(); }
    }
  }
  if (flash) flash.t -= dt;
  popups.forEach(p => p.t -= dt * 0.8);
  popups = popups.filter(p => p.t > 0);
  $('score').textContent = score;
  $('time').textContent = Math.ceil(timeLeft);
  const f = timeLeft / TIME;
  $('timefill').style.width = (f * 100) + '%';
  $('timefill').style.background = f < 0.25 ? '#e2553f' : '#7cc36a';
  draw();
  requestAnimationFrame(loop);
}
